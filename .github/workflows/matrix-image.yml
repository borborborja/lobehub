name: Build Matrix-patched image

# Builds a LobeHub image that combines the latest upstream release with the
# Matrix IM gateway patch (branch `feat/matrix-im-gateway`) and pushes it to
# GHCR for both linux/amd64 and linux/arm64.
#
# Uses NATIVE runners per arch (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm) and merges the digests into one manifest — the same shape
# LobeHub's own release workflow uses. This avoids QEMU emulation, which is so
# slow for the Next.js build that it blows past the 6h job limit.
#
# The patch branch is NOT modified: the upstream release is merged into a
# throwaway working tree inside each runner, so the PR stays clean. On a
# merge conflict the build fails — rebase/resolve on the patch branch and
# re-run.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lobehub-matrix
  PATCH_BRANCH: feat/matrix-im-gateway
  UPSTREAM_REPO: lobehub/lobehub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout patch branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: up
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve latest upstream release"; exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Merge upstream release into the patch (ephemeral)
        run: |
          set -euo pipefail
          git config user.name  "matrix-rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "refs/tags/${{ steps.up.outputs.tag }}:refs/tags/upstream-release"
          if ! git merge --no-edit upstream-release; then
            echo "::error::Merge conflict between the Matrix patch and upstream ${{ steps.up.outputs.tag }}. Rebase/resolve on ${PATCH_BRANCH} and re-run."
            git merge --abort || true
            exit 1
          fi

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest & push tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Resolve latest upstream release
        id: up
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ steps.up.outputs.version }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect & summary
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.up.outputs.version }}
          {
            echo "### ✅ Pushed \`${IMAGE}:${{ steps.up.outputs.version }}\` (amd64 + arm64)"
            echo ""
            echo "- Upstream release: \`${{ steps.up.outputs.tag }}\`"
            echo "- Tags: \`latest\`, \`${{ steps.up.outputs.version }}\`"
            echo "- Pull: \`docker pull ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
