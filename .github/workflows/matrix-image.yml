name: Build Matrix-patched image

# Builds a LobeHub image that combines the latest upstream release with the
# Matrix IM gateway patch (branch `feat/matrix-im-gateway`) and pushes it to
# GHCR. The patch branch is NOT modified: the upstream release is merged into
# a throwaway working tree inside the runner, so the PR stays clean.
#
# Runs daily and on demand. If upstream and the patch conflict, the merge step
# fails (you get a red run) — resolve the conflict on the patch branch and
# re-run.

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 04:17 UTC. LobeHub releases frequently; a daily rebuild keeps
    # the image close to upstream without hammering the runner.
    - cron: '17 4 * * *'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lobehub-matrix
  PATCH_BRANCH: feat/matrix-im-gateway
  UPSTREAM_REPO: lobehub/lobehub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: up
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve latest upstream release"; exit 1
          fi
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Merge upstream release into the patch (ephemeral)
        run: |
          set -euo pipefail
          git config user.name  "matrix-rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "refs/tags/${{ steps.up.outputs.tag }}:refs/tags/upstream-release"
          if ! git merge --no-edit upstream-release; then
            echo "::error::Merge conflict between the Matrix patch and upstream ${{ steps.up.outputs.tag }}. Rebase/resolve on ${PATCH_BRANCH} and re-run."
            git merge --abort || true
            exit 1
          fi

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Add linux/arm64 here if you deploy on ARM (slower builds; needs QEMU).
          platforms: linux/amd64
          push: true
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.up.outputs.version }}
          labels: |
            org.opencontainers.image.title=lobehub-matrix
            org.opencontainers.image.description=LobeHub ${{ steps.up.outputs.tag }} + Matrix IM gateway
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Summary
        run: |
          {
            echo "### ✅ Built \`${IMAGE}:${{ steps.up.outputs.version }}\`"
            echo ""
            echo "- Upstream release: \`${{ steps.up.outputs.tag }}\`"
            echo "- Tags pushed: \`latest\`, \`${{ steps.up.outputs.version }}\`"
            echo "- Pull: \`docker pull ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
